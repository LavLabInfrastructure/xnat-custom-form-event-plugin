buildscript {
    ext {
        vXnat = "1.10.0"
    }
}

plugins {
    id "java"
    id "com.palantir.git-version" version "3.1.0"
    id "io.spring.dependency-management" version "1.1.6"
    id "org.nrg.xnat.build.xnat-data-builder" version "${vXnat}"
}

group = "org.nrg.xnatx.plugins"
version = providers.gradleProperty("releaseVersion").getOrElse("1.0.0-SNAPSHOT")
description = "Publishes an event when XNAT custom form data changes"

repositories {
    mavenLocal()
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
}

dependencyManagement.imports {
    mavenBom "org.nrg:parent:${vXnat}"
}

dependencies {
    implementation enforcedPlatform("org.nrg:parent:${vXnat}")
    implementation("org.nrg.xnat:web") { transitive = false }
    implementation("org.nrg.xnat:xnat-data-models") { transitive = false }
    implementation "org.nrg.xdat:core"
    implementation "org.nrg:framework"
    implementation "org.nrg:prefs"
    implementation "org.aspectj:aspectjweaver:1.9.22.1"

    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.assertj:assertj-core"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

compileJava {
    dependsOn xnatDataBuilder
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    main {
        java {
            srcDir "build/xnat-generated/src/main/java"
        }
        resources {
            srcDir "build/xnat-generated/src/main/resources"
        }
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("xnatPluginJar", Jar) {
    dependsOn test
    archiveClassifier.set "xpl"
    from sourceSets.main.output
    exclude "**/*-dev**", "**/*--xx**"
}

test {
    useJUnitPlatform()
}
